name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # resume.pdf, rack-poster.png and og.png into dist/
      - run: |
          npx astro preview --port 4321 &
          npx wait-on -t 60000 http://localhost:4321
          node scripts/render.mjs http://localhost:4321
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/0xjmart/resume-site
          # main-<run>-<sha> sorts by run number, so Flux image automation picks the newest build.
          tags: |
            type=raw,value=main-${{ github.run_number }}-{{sha}},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      # COPY-only image, so cross-building for the Pi cluster needs no emulation
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
